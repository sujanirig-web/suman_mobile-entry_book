<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>RE-LiFE | ENTRY-BOOK-2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://relife-api-proxy.sujanirig.workers.dev" crossorigin>
    <script src="https://unpkg.com/nepali-date-converter@3.3.3/dist/nepali-date-converter.umd.js"></script>
    <link href="tw.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }
        input, select, textarea {
            font-size: 16px !important;
            touch-action: manipulation;
        }
        .rotate-180 {
            transform: rotate(180deg);
        }
        .transition-chevron {
            transition: transform 0.3s ease;
        }
        .blur-strong {
            filter: blur(20px);
        }
        #repairTableBody tr {
            border-bottom: 1px solid #cbd5e1 !important;
        }
        #repairTableBody tr:hover {
            background-color: #f8fafc;
        }

      
        .modal-ios {
            transition: opacity 0.4s cubic-bezier(0.32, 0.94, 0.6, 1);
            opacity: 0;
            pointer-events: none;
        }
        .modal-ios.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-ios .modal-content {
            transition: transform 0.5s cubic-bezier(0.32, 0.94, 0.6, 1),
                        opacity 0.5s cubic-bezier(0.32, 0.94, 0.6, 1);
            transform: scale(0.85) translateY(10px);
            opacity: 0;
        }
        .modal-ios.active .modal-content {
            transform: scale(1) translateY(0px);
            opacity: 1;
        }
        .modal-ios.image-modal .modal-content {
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.32, 0.94, 0.6, 1),
                        opacity 0.4s cubic-bezier(0.32, 0.94, 0.6, 1);
        }
        .modal-ios.image-modal.active .modal-content {
            transform: scale(1);
        }
        .modal-ios.image-modal.active {
            background: rgba(0,0,0,0.9);
        }
        .modal-ios .absolute.inset-0 {
            transition: opacity 0.4s ease;
            opacity: 0;
        }
        .modal-ios.active .absolute.inset-0 {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    
    <div id="loginOverlay" style="position:fixed; inset:0; background:#111; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:white; padding:30px; border-radius:10px; width:300px;">
            <h2 style="margin-bottom:15px;">Login</h2>
            <input id="loginEmail" type="email" placeholder="Email" style="width:100%; margin-bottom:10px; padding:8px; font-size:16px;">
            <input id="loginPass" type="password" placeholder="Password" style="width:100%; margin-bottom:10px; padding:8px; font-size:16px;">
            <button id="loginBtn" style="width:100%; padding:10px; background:black; color:white;">Access Book</button>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center shadow-lg shadow-green-200">
                    <svg class="text-white" viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="vertical-align:-0.125em;font-size:18px"><path d="M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-green-600">RE-LiFE</h1>
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">ENTRY-BOOK_2.0</span>
                </div>
            </div>
            <button onclick="toggleModal('entryModal')" class="bg-green-600 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-green-700 transition-all flex items-center shadow-lg shadow-green-100 active:scale-95">
                <svg class="mr-2" viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="vertical-align:-0.125em"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM232 344V280H168c-13.3 0-24-10.7-24-24s10.7-24 24-24h64V168c0-13.3 10.7-24 24-24s24 10.7 24 24v64h64c13.3 0 24 10.7 24 24s-10.7 24-24 24H280v64c0 13.3-10.7 24-24 24s-24-10.7-24-24z"/></svg> New Repair
            </button>
        </div>
    </nav>

    
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div class="flex items-start gap-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 flex-1">
                <div onclick="setTab('all')" id="card-all" class="stat-card active-tab glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-slate-100 text-6xl group-hover:scale-110"><svg viewBox="0 0 576 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M264.5 5.2c14.9-6.9 32.1-6.9 47 0l218.6 101c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 149.8C37.4 145.8 32 137.3 32 128s5.4-17.9 13.9-21.8L264.5 5.2zM476.9 209.6l53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 277.8C37.4 273.8 32 265.3 32 256s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0l152-70.2zm-152 198.2l152-70.2 53.2 24.6c8.5 3.9 13.9 12.4 13.9 21.8s-5.4 17.9-13.9 21.8l-218.6 101c-14.9 6.9-32.1 6.9-47 0L45.9 405.8C37.4 401.8 32 393.3 32 384s5.4-17.9 13.9-21.8l53.2-24.6 152 70.2c23.4 10.8 50.4 10.8 73.8 0z"/></svg></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Total Entries</p>
                    <h3 class="text-2xl font-extrabold text-slate-800" id="stat-total">0</h3>
                </div>
                <div onclick="setTab('pending')" id="card-pending" class="stat-card glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-orange-100 text-6xl group-hover:scale-110"><svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M256 0a256 256 0 1 1 0 512A256 256 0 1 1 256 0zM232 120V256c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2V120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Pending</p>
                    <h3 class="text-2xl font-extrabold text-orange-600" id="stat-active">0</h3>
                </div>
                <div onclick="setTab('fixed')" id="card-fixed" class="stat-card glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-emerald-100 text-6xl group-hover:scale-110"><svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/></svg></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Fixed</p>
                    <h3 class="text-2xl font-extrabold text-emerald-600" id="stat-fixed-count">0</h3>
                </div>
                <div onclick="setTab('returned')" id="card-returned" class="stat-card glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-blue-100 text-6xl group-hover:scale-110"><svg viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M125.7 160H176c17.7 0 32 14.3 32 32s-14.3 32-32 32H48c-17.7 0-32-14.3-32-32V64c0-17.7 14.3-32 32-32s32 14.3 32 32v51.2L97.6 97.6c87.5-87.5 229.3-87.5 316.8 0s87.5 229.3 0 316.8s-229.3 87.5-316.8 0c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0c62.5 62.5 163.8 62.5 226.3 0s62.5-163.8 0-226.3s-163.8-62.5-226.3 0L125.7 160z"/></svg></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Returned</p>
                    <h3 class="text-2xl font-extrabold text-blue-600" id="stat-returned-count">0</h3>
                </div>
                <div onclick="toggleRevenueCensor()" id="revenueCard" class="bg-slate-900 p-4 rounded-2xl relative overflow-hidden cursor-pointer group">
                    <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">Revenue</p>
                    <h3 id="stat-revenue" class="text-2xl font-extrabold text-white blur-strong transition-all duration-200">रू0</h3>
                </div>
            </div>
            <button onclick="toggleViewMode()" id="viewToggleBtn" class="w-10 h-[108px] rounded-2xl bg-white border border-slate-200 flex items-center justify-center hover:bg-indigo-50 transition-all group shrink-0 shadow-sm">
                <svg id="viewToggleIcon" class="text-slate-400 group-hover:text-indigo-600 transition-transform duration-300" viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="vertical-align:-0.125em;font-size:16px"><path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"/></svg>
            </button>
        </div>

        <div class="mb-8 flex flex-col md:flex-row gap-6 items-center justify-between mt-8">
            <div class="flex gap-4 w-full md:w-auto flex-wrap items-center">
                <input type="text" id="searchInput" placeholder="Search..." class="w-full md:w-80 pl-4 py-3 bg-white border border-slate-200 rounded-2xl outline-none shadow-sm text-base">
                <select id="statusFilter" class="px-4 py-3 bg-white border border-slate-200 rounded-2xl font-medium text-base">
                    <option value="today">Today</option>
                    <option value="all" selected>All</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="paid">Paid</option>
                    <option value="unpaid">Unpaid</option>
                </select>
                <div class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                    <button onclick="prevPeriod()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition">←</button>
                    <span id="dateLabel" onclick="goToday()" class="text-sm font-semibold text-slate-700 min-w-[120px] text-center cursor-pointer hover:text-indigo-600 transition">Today</span>
                    <button onclick="nextPeriod()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition">→</button>
                </div>
            </div>
            <div onclick="toggleDueCensor()" id="dueCard" class="bg-red-50 px-6 py-3 rounded-2xl flex items-center gap-4 border border-red-100 cursor-pointer group">
                <svg class="text-red-500" viewBox="0 0 576 512" width="1.25em" height="1.25em" fill="currentColor" aria-hidden="true"><path d="M312 24V34.5c6.4 1.2 12.6 2.7 18.2 4.2c12.8 3.4 20.4 16.6 17 29.4s-16.6 20.4-29.4 17c-10.9-2.9-21.1-4.9-30.2-5c-7.3-.1-14.7 1.7-19.4 4.4c-2.1 1.3-3.1 2.4-3.5 3c-.3 .5-.7 1.2-.7 2.8c0 .3 0 .5 0 .6c.2 .2 .9 1.2 3.3 2.6c5.8 3.5 14.4 6.2 27.4 10.1l.9 .3 0 0c11.1 3.3 25.9 7.8 37.9 15.3c13.7 8.6 26.1 22.9 26.4 44.9c.3 22.5-11.4 38.9-26.7 48.5c-6.7 4.1-13.9 7-21.3 8.8V232c0 13.3-10.7 24-24 24s-24-10.7-24-24V220.6c-9.5-2.3-18.2-5.3-25.6-7.8c-2.1-.7-4.1-1.4-6-2c-12.6-4.2-19.4-17.8-15.2-30.4s17.8-19.4 30.4-15.2c2.6 .9 5 1.7 7.3 2.5c13.6 4.6 23.4 7.9 33.9 8.3c8 .3 15.1-1.6 19.2-4.1c1.9-1.2 2.8-2.2 3.2-2.9c.4-.6 .9-1.8 .8-4.1l0-.2c0-1 0-2.1-4-4.6c-5.7-3.6-14.3-6.4-27.1-10.3l-1.9-.6c-10.8-3.2-25-7.5-36.4-14.4c-13.5-8.1-26.5-22-26.6-44.1c-.1-22.9 12.9-38.6 27.7-47.4c6.4-3.8 13.3-6.4 20.2-8.2V24c0-13.3 10.7-24 24-24s24 10.7 24 24zM568.2 336.3c13.1 17.8 9.3 42.8-8.5 55.9L433.1 485.5c-23.4 17.2-51.6 26.5-80.7 26.5H192 32c-17.7 0-32-14.3-32-32V416c0-17.7 14.3-32 32-32H68.8l44.9-36c22.7-18.2 50.9-28 80-28H272h16 64c17.7 0 32 14.3 32 32s-14.3 32-32 32H288 272c-8.8 0-16 7.2-16 16s7.2 16 16 16H392.6l119.7-88.2c17.8-13.1 42.8-9.3 55.9 8.5zM193.6 384l0 0-.9 0c.3 0 .6 0 .9 0z"/></svg>
                <h4 id="stat-credit" class="text-lg font-bold text-red-600 blur-strong transition-all duration-200">रू0</h4>
            </div>
        </div>

        <div id="paginationTop" class="mb-4"></div>

        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b">
                            <th class="px-8 py-5">Ticket</th>
                            <th class="px-6 py-5">Customer</th>
                            <th class="px-6 py-5">Issue & Media</th>
                            <th class="px-6 py-5">Status</th>
                            <th class="px-6 py-5">Payment</th>
                            <th class="px-8 py-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="repairTableBody" class="divide-y"></tbody>
                </table>
            </div>
            <div id="noDataMessage" class="hidden py-20 text-center text-slate-400">No repairs found</div>
        </div>
        <div id="paginationBottom" class="mt-4"></div>
        <div id="loadMoreContainer"></div>
    </main>

    <div id="entryModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-5 modal-ios">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="toggleModal('entryModal')"></div>
        <div class="modal-content bg-white w-full max-w-2xl rounded-[2rem] relative z-10 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-green-600 p-6 text-white flex justify-between">
                <h2 id="modalTitle" class="text-xl font-bold">New Repair Job</h2>
                <button onclick="toggleModal('entryModal')"><svg class="text-white" viewBox="0 0 384 512" width="1.25em" height="1.25em" fill="currentColor" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg></button>
            </div>
            <form id="repairForm" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto">
                <input type="text" id="snNumber" placeholder="Serial Number" class="p-3 bg-slate-50 border rounded-xl outline-none text-base uppercase">
                <input type="text" id="customerName" placeholder="Client Name" required class="p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="text" id="deviceModel" placeholder="Device Model" required class="p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="text" id="issueType" placeholder="Describe the issue" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="tel" id="customerPhone" placeholder="Phone (optional)" class="p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="text" id="devicePassword" placeholder="Device Password (optional)" class="p-3 bg-slate-50 border rounded-xl text-base">
                <div class="md:col-span-2"></div>
                <div class="md:col-span-2 space-y-2">
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase">Device Photos</label>
                    <div class="flex gap-2">
                        <input type="file" id="photoGallery" accept="image/*" class="hidden" onchange="handleImageUpload(this)">
                        <input type="file" id="photoCamera" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(this)">
                        <button type="button" onclick="document.getElementById('photoGallery').click()" class="flex-1 py-3 bg-slate-100 rounded-xl text-xs font-bold text-slate-600"><svg class="mr-1" viewBox="0 0 576 512" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="vertical-align:-0.125em"><path d="M160 32c-35.3 0-64 28.7-64 64V320c0 35.3 28.7 64 64 64H512c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H160zM396 138.7l96 144c4.9 7.4 5.4 16.8 1.2 24.6S480.9 320 472 320H328 280 200c-9.2 0-17.6-5.3-21.6-13.6s-2.9-18.2 2.9-25.4l64-80c4.6-5.7 11.4-9 18.7-9s14.2 3.3 18.7 9l17.3 21.6 56-84C360.5 132 368 128 376 128s15.5 4 20 10.7zM192 128a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zM48 120c0-13.3-10.7-24-24-24S0 106.7 0 120V344c0 75.1 60.9 136 136 136H456c13.3 0 24-10.7 24-24s-10.7-24-24-24H136c-48.6 0-88-39.4-88-88V120z"/></svg> Gallery</button>
                        <button type="button" onclick="document.getElementById('photoCamera').click()" class="flex-1 py-3 bg-slate-100 rounded-xl text-xs font-bold text-slate-600"><svg class="mr-1" viewBox="0 0 512 512" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="vertical-align:-0.125em"><path d="M149.1 64.8L138.7 96H64C28.7 96 0 124.7 0 160V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V160c0-35.3-28.7-64-64-64H373.3L362.9 64.8C356.4 45.2 338.1 32 317.4 32H194.6c-20.7 0-39 13.2-45.5 32.8zM256 192a96 96 0 1 1 0 192 96 96 0 1 1 0-192z"/></svg> Camera</button>
                    </div>
                    <div id="imagePreview" class="hidden relative w-20 h-20 rounded-lg border overflow-hidden">
                        <img id="previewImg" src="" class="w-full h-full object-cover">
                        <button type="button" onclick="removeImage()" class="absolute top-0 right-0 bg-red-500 text-white p-1"><svg viewBox="0 0 384 512" width="0.6em" height="0.6em" fill="currentColor" aria-hidden="true"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg></button>
                    </div>
                </div>
                <input type="number" id="cost" placeholder="Total Cost (रू)" class="p-3 bg-slate-50 border rounded-xl text-base font-bold">
                <input type="number" id="paid" placeholder="Amount Paid (रू)" class="p-3 bg-green-50 border-green-100 rounded-xl text-base font-bold text-indigo-600">
                <button type="submit" class="md:col-span-2 bg-slate-900 text-white py-4 rounded-2xl font-bold">Log Entry</button>
            </form>
        </div>
    </div>

    <div id="logsModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-5 modal-ios">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="toggleModal('logsModal')"></div>
        <div class="modal-content bg-white w-full max-w-2xl rounded-[2rem] relative z-10 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-indigo-600 p-6 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold">Change Logs</h2>

            <img id="fullSizeImage" src="" class="max-w-full max-h-full rounded-lg">
        </div>
    </div>

    </div>

    <script type="module" src="app.js" defer></script>

    
    <script>
        (function() {
            let attempts = 0;
            const maxAttempts = 30;
            const interval = setInterval(() => {
                attempts++;
                if (typeof window.toggleModal === 'function') {
                    clearInterval(interval);

                    const originalToggle = window.toggleModal;

                    window.toggleModal = function(id) {
                        const modal = document.getElementById(id);
                        if (!modal) return;
                        if (modal.dataset.animating === '1') return;

                        const isOpen = !modal.classList.contains('hidden') && modal.classList.contains('active');

                        if (isOpen) {
                            
                            modal.dataset.animating = '1';
                            modal.classList.remove('active');
                            const duration = 500;
                            setTimeout(() => {
                                originalToggle.call(window, id);
                                if (!modal.classList.contains('hidden')) modal.classList.add('hidden');
                                document.body.style.overflow = 'auto';
                                delete modal.dataset.animating;
                            }, duration);
                        } else {
                            
                            originalToggle.call(window, id);
                            requestAnimationFrame(() => {
                                if (!modal.classList.contains('hidden')) {
                                    modal.classList.add('active');
                                    document.body.style.overflow = 'hidden';
                                }
                            });
                        }
                    };

                    
                    if (typeof window.viewImage === 'function') {
                        const originalViewImage = window.viewImage;
                        window.viewImage = function(src) {
                            document.getElementById('fullSizeImage').src = src;
                            window.toggleModal('viewImageModal');
                        };
                    }

                    console.log('✅ iOS zoom animation active – New Repair & Edit both work.');
                }
                if (attempts >= maxAttempts) clearInterval(interval);
            }, 100);
        })();
    </script>
