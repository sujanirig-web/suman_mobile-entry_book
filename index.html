<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>RE-LiFE | ENTRY-BOOK-1.1</title>
    <script src="https://unpkg.com/nepali-date-converter@3.3.3/dist/nepali-date-converter.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }
        input, select, textarea {
            font-size: 16px !important;
            touch-action: manipulation;
        }
        .rotate-180 {
            transform: rotate(180deg);
        }
        .transition-chevron {
            transition: transform 0.3s ease;
        }
        .blur-strong {
            filter: blur(20px);
        }
        #repairTableBody tr {
            border-bottom: 1px solid #cbd5e1 !important;
        }
        #repairTableBody tr:hover {
            background-color: #f8fafc;
        }

      
        .modal-ios {
            transition: opacity 0.4s cubic-bezier(0.32, 0.94, 0.6, 1);
            opacity: 0;
            pointer-events: none;
        }
        .modal-ios.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-ios .modal-content {
            transition: transform 0.5s cubic-bezier(0.32, 0.94, 0.6, 1),
                        opacity 0.5s cubic-bezier(0.32, 0.94, 0.6, 1);
            transform: scale(0.85) translateY(10px);
            opacity: 0;
        }
        .modal-ios.active .modal-content {
            transform: scale(1) translateY(0px);
            opacity: 1;
        }
        .modal-ios.image-modal .modal-content {
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.32, 0.94, 0.6, 1),
                        opacity 0.4s cubic-bezier(0.32, 0.94, 0.6, 1);
        }
        .modal-ios.image-modal.active .modal-content {
            transform: scale(1);
        }
        .modal-ios.image-modal.active {
            background: rgba(0,0,0,0.9);
        }
        .modal-ios .absolute.inset-0 {
            transition: opacity 0.4s ease;
            opacity: 0;
        }
        .modal-ios.active .absolute.inset-0 {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    
    <div id="loginOverlay" style="position:fixed; inset:0; background:#111; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:white; padding:30px; border-radius:10px; width:300px;">
            <h2 style="margin-bottom:15px;">Login</h2>
            <input id="loginEmail" type="email" placeholder="Email" style="width:100%; margin-bottom:10px; padding:8px; font-size:16px;">
            <input id="loginPass" type="password" placeholder="Password" style="width:100%; margin-bottom:10px; padding:8px; font-size:16px;">
            <button id="loginBtn" style="width:100%; padding:10px; background:black; color:white;">Access Book</button>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center shadow-lg shadow-green-200">
                    <i class="fas fa-book text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-green-600">RE-LiFE</h1>
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">ENTRY-BOOK_1.1</span>
                </div>
            </div>
            <button onclick="toggleModal('entryModal')" class="bg-green-600 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-green-700 transition-all flex items-center shadow-lg shadow-green-100 active:scale-95">
                <i class="fas fa-plus-circle mr-2"></i> New Repair
            </button>
        </div>
    </nav>

    
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div class="flex items-start gap-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 flex-1">
                <div onclick="setTab('all')" id="card-all" class="stat-card active-tab glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-slate-100 text-6xl group-hover:scale-110"><i class="fas fa-layer-group"></i></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Total Entries</p>
                    <h3 class="text-2xl font-extrabold text-slate-800" id="stat-total">0</h3>
                </div>
                <div onclick="setTab('pending')" id="card-pending" class="stat-card glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-orange-100 text-6xl group-hover:scale-110"><i class="fas fa-clock"></i></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Pending</p>
                    <h3 class="text-2xl font-extrabold text-orange-600" id="stat-active">0</h3>
                </div>
                <div onclick="setTab('fixed')" id="card-fixed" class="stat-card glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-emerald-100 text-6xl group-hover:scale-110"><i class="fas fa-circle-check"></i></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Fixed</p>
                    <h3 class="text-2xl font-extrabold text-emerald-600" id="stat-fixed-count">0</h3>
                </div>
                <div onclick="setTab('returned')" id="card-returned" class="stat-card glass p-4 rounded-2xl shadow-sm relative overflow-hidden group cursor-pointer">
                    <div class="absolute -right-4 -top-4 text-blue-100 text-6xl group-hover:scale-110"><i class="fas fa-undo-alt"></i></div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Returned</p>
                    <h3 class="text-2xl font-extrabold text-blue-600" id="stat-returned-count">0</h3>
                </div>
                <div onclick="toggleRevenueCensor()" id="revenueCard" class="bg-slate-900 p-4 rounded-2xl relative overflow-hidden cursor-pointer group">
                    <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">Revenue</p>
                    <h3 id="stat-revenue" class="text-2xl font-extrabold text-white blur-strong transition-all duration-200">रू0</h3>
                </div>
            </div>
            <button onclick="toggleViewMode()" id="viewToggleBtn" class="w-10 h-[108px] rounded-2xl bg-white border border-slate-200 flex items-center justify-center hover:bg-indigo-50 transition-all group shrink-0 shadow-sm">
                <i id="viewToggleIcon" class="fas fa-chevron-down text-slate-400 group-hover:text-indigo-600 transition-transform duration-300 text-base"></i>
            </button>
        </div>

        <div class="mb-8 flex flex-col md:flex-row gap-6 items-center justify-between mt-8">
            <div class="flex gap-4 w-full md:w-auto flex-wrap items-center">
                <input type="text" id="searchInput" placeholder="Search..." class="w-full md:w-80 pl-4 py-3 bg-white border border-slate-200 rounded-2xl outline-none shadow-sm text-base">
                <select id="statusFilter" class="px-4 py-3 bg-white border border-slate-200 rounded-2xl font-medium text-base">
                    <option value="today">Today</option>
                    <option value="all" selected>All</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="paid">Paid</option>
                    <option value="unpaid">Unpaid</option>
                </select>
                <div class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm">
                    <button onclick="prevPeriod()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition">←</button>
                    <span id="dateLabel" onclick="goToday()" class="text-sm font-semibold text-slate-700 min-w-[120px] text-center cursor-pointer hover:text-indigo-600 transition">Today</span>
                    <button onclick="nextPeriod()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-600 transition">→</button>
                </div>
            </div>
            <div onclick="toggleDueCensor()" id="dueCard" class="bg-red-50 px-6 py-3 rounded-2xl flex items-center gap-4 border border-red-100 cursor-pointer group">
                <i class="fas fa-hand-holding-dollar text-red-500"></i>
                <h4 id="stat-credit" class="text-lg font-bold text-red-600 blur-strong transition-all duration-200">रू0</h4>
            </div>
        </div>

        <div id="paginationTop" class="mb-4"></div>

        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b">
                            <th class="px-8 py-5">Ticket</th>
                            <th class="px-6 py-5">Customer</th>
                            <th class="px-6 py-5">Issue & Media</th>
                            <th class="px-6 py-5">Status</th>
                            <th class="px-6 py-5">Payment</th>
                            <th class="px-8 py-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="repairTableBody" class="divide-y"></tbody>
                </table>
            </div>
            <div id="noDataMessage" class="hidden py-20 text-center text-slate-400">No repairs found</div>
        </div>
        <div id="paginationBottom" class="mt-4"></div>
    </main>

    <div id="entryModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-5 modal-ios">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="toggleModal('entryModal')"></div>
        <div class="modal-content bg-white w-full max-w-2xl rounded-[2rem] relative z-10 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-green-600 p-6 text-white flex justify-between">
                <h2 id="modalTitle" class="text-xl font-bold">New Repair Job</h2>
                <button onclick="toggleModal('entryModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="repairForm" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto">
                <input type="text" id="snNumber" placeholder="Serial Number" class="p-3 bg-slate-50 border rounded-xl outline-none text-base uppercase">
                <input type="text" id="customerName" placeholder="Client Name" required class="p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="text" id="deviceModel" placeholder="Device Model" required class="p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="text" id="issueType" placeholder="Describe the issue" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="tel" id="customerPhone" placeholder="Phone (optional)" class="p-3 bg-slate-50 border rounded-xl outline-none text-base">
                <input type="text" id="devicePassword" placeholder="Device Password (optional)" class="p-3 bg-slate-50 border rounded-xl text-base">
                <div class="md:col-span-2"></div>
                <div class="md:col-span-2 space-y-2">
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase">Device Photos</label>
                    <div class="flex gap-2">
                        <input type="file" id="photoGallery" accept="image/*" class="hidden" onchange="handleImageUpload(this)">
                        <input type="file" id="photoCamera" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(this)">
                        <button type="button" onclick="document.getElementById('photoGallery').click()" class="flex-1 py-3 bg-slate-100 rounded-xl text-xs font-bold text-slate-600"><i class="fas fa-images mr-1"></i> Gallery</button>
                        <button type="button" onclick="document.getElementById('photoCamera').click()" class="flex-1 py-3 bg-slate-100 rounded-xl text-xs font-bold text-slate-600"><i class="fas fa-camera mr-1"></i> Camera</button>
                    </div>
                    <div id="imagePreview" class="hidden relative w-20 h-20 rounded-lg border overflow-hidden">
                        <img id="previewImg" src="" class="w-full h-full object-cover">
                        <button type="button" onclick="removeImage()" class="absolute top-0 right-0 bg-red-500 text-white p-1 text-[8px]"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <input type="number" id="cost" placeholder="Total Cost (रू)" class="p-3 bg-slate-50 border rounded-xl text-base font-bold">
                <input type="number" id="paid" placeholder="Amount Paid (रू)" class="p-3 bg-green-50 border-green-100 rounded-xl text-base font-bold text-indigo-600">
                <button type="submit" class="md:col-span-2 bg-slate-900 text-white py-4 rounded-2xl font-bold">Log Entry</button>
            </form>
        </div>
    </div>

    <div id="logsModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-5 modal-ios">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="toggleModal('logsModal')"></div>
        <div class="modal-content bg-white w-full max-w-2xl rounded-[2rem] relative z-10 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-indigo-600 p-6 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold">Change Logs</h2>
                <button onclick="toggleModal('logsModal')"><i class="fas fa-times"></i></button>
            </div>
            <div id="logsList" class="overflow-y-auto p-4"></div>
        </div>
    </div>

    <div id="viewImageModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4 modal-ios image-modal" onclick="toggleModal('viewImageModal')">
        <div class="modal-content max-w-full max-h-full flex items-center justify-center">
            <img id="fullSizeImage" src="" class="max-w-full max-h-full rounded-lg">
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all pointer-events-none z-[100]">
        <div class="bg-slate-900 text-white px-8 py-4 rounded-2xl shadow-2xl text-sm font-semibold" id="toastMessage"></div>
    </div>

    <script type="module" src="app.js" defer></script>

    
    <script>
        (function() {
            let attempts = 0;
            const maxAttempts = 30;
            const interval = setInterval(() => {
                attempts++;
                if (typeof window.toggleModal === 'function') {
                    clearInterval(interval);

                    const originalToggle = window.toggleModal;

                    window.toggleModal = function(id) {
                        const modal = document.getElementById(id);
                        if (!modal) return;

                        const isOpen = !modal.classList.contains('hidden') && modal.classList.contains('active');

                        if (isOpen) {
                            
                            modal.classList.remove('active');
                            const duration = 500;
                            setTimeout(() => {
                                originalToggle.call(window, id);
                                if (!modal.classList.contains('hidden')) modal.classList.add('hidden');
                                document.body.style.overflow = 'auto';
                            }, duration);
                        } else {
                            
                            originalToggle.call(window, id);
                            requestAnimationFrame(() => {
                                if (!modal.classList.contains('hidden')) {
                                    modal.classList.add('active');
                                    document.body.style.overflow = 'hidden';
                                }
                            });
                        }
                    };

                    
                    if (typeof window.viewImage === 'function') {
                        const originalViewImage = window.viewImage;
                        window.viewImage = function(src) {
                            document.getElementById('fullSizeImage').src = src;
                            window.toggleModal('viewImageModal');
                        };
                    }

                    console.log('✅ iOS zoom animation active – New Repair & Edit both work.');
                }
                if (attempts >= maxAttempts) clearInterval(interval);
            }, 100);
        })();
    </script>
</body>
</html>
